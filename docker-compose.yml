version: '3.8'

services:
  # ─── BLACKBOX GATEWAY ────────────────────────────────────────────
  gateway:
    build: .
    container_name: blackbox-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=blackbox
      - DB_USER=blackbox
      - DB_PASSWORD=blackbox
      - BACKEND_URL=http://mock-backend:8081
      - JWT_SECRET=blackbox-dev-secret-key-must-be-at-least-256-bits-long-for-hs256
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mock-backend:
        condition: service_started
    networks:
      - blackbox-net
    restart: unless-stopped

  # ─── MOCK BACKEND ───────────────────────────────────────────────
  # Simple HTTP server that simulates a downstream service.
  # Configurable delay and error rate for chaos testing.
  mock-backend:
    build: ./mock-backend
    container_name: blackbox-mock-backend
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - SIMULATED_DELAY_MS=50
      - ERROR_RATE=0.0
    networks:
      - blackbox-net
    restart: unless-stopped

  # ─── REDIS ──────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: blackbox-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - blackbox-net
    restart: unless-stopped

  # ─── POSTGRESQL ─────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: blackbox-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: blackbox
      POSTGRES_USER: blackbox
      POSTGRES_PASSWORD: blackbox
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U blackbox" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - blackbox-net
    restart: unless-stopped

  # ─── PROMETHEUS ─────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: blackbox-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - gateway
    networks:
      - blackbox-net
    restart: unless-stopped

  # ─── GRAFANA ────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: blackbox-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - blackbox-net
    restart: unless-stopped

volumes:
  postgres-data:
  grafana-data:


networks:
  blackbox-net:
    driver: bridge
