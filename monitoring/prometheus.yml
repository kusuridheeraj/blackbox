global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'blackbox-gateway'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['gateway:8080']
        labels:
          application: 'blackbox-gateway'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
